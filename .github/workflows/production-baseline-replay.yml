name: Production Baseline Replay
# Season 1 final release HEAD replay trigger

on:
  workflow_dispatch:
  push:
    branches:
      - release/season-1-v1
    paths:
      - "supabase/migrations/**"
      - "supabase/migrations_legacy/**"
      - "supabase/config.toml"
      - "scripts/production-reference-data.sql"
      - "scripts/production-fixture-audit.sql"
      - "scripts/audit-production-baseline.cjs"
      - "scripts/schema-manifest.cjs"
      - ".github/workflows/production-baseline-replay.yml"

jobs:
  production-baseline-replay:
    name: Production baseline replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deterministic Supabase CLI
        run: |
          npx --no-install supabase --version
          test "$(npx --no-install supabase --version)" = "2.111.0"

      - name: Verify Docker runner
        run: |
          echo "Supabase image registry: $SUPABASE_INTERNAL_IMAGE_REGISTRY"
          docker version
          docker info

      - name: Static baseline audit
        run: node scripts/audit-production-baseline.cjs

      - name: Prepare production-like local stack config
        run: |
          perl -0pi -e 's/(\[db\.seed\][\s\S]*?enabled = )true/${1}false/' supabase/config.toml
          perl -0pi -e 's/health_timeout = "2m"/health_timeout = "10m"/' supabase/config.toml
          grep 'health_timeout' supabase/config.toml
          grep -A3 '^\[db.seed\]' supabase/config.toml

      - name: Start Supabase local
        run: |
          set +e
          npx --no-install supabase start --debug \
            --exclude gotrue \
            --exclude realtime \
            --exclude storage-api \
            --exclude imgproxy \
            --exclude kong \
            --exclude mailpit \
            --exclude postgrest \
            --exclude postgres-meta \
            --exclude studio \
            --exclude edge-runtime \
            --exclude logflare \
            --exclude vector \
            --exclude supavisor \
            2>&1 | tee supabase-start.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Supabase start failure diagnostics"
              echo
              echo "### CLI error lines"
              grep -inE 'error|failed|panic|fatal|syntax|cannot|does not exist|already exists|permission denied|violates|constraint|relation|column|function|operator' supabase-start.log || true
              echo
              echo "### Supabase containers"
              docker ps -a --filter "name=supabase_" || true
              echo
              echo "### Database container logs"
              db_container="$(docker ps -a --filter "name=supabase_db_" --format "{{.Names}}" | head -n 1)"
              if [ -n "$db_container" ]; then
                docker logs --tail 220 "$db_container" || true
              else
                echo "No Supabase database container found."
              fi
              echo
              echo "### Supabase start tail"
              tail -n 180 supabase-start.log
            } > supabase-start-root-cause.txt
            cat supabase-start-root-cause.txt >> "$GITHUB_STEP_SUMMARY"
            tail_text="$(tail -n 180 supabase-start-root-cause.txt)"
            safe_text="${tail_text//'%'/'%25'}"
            safe_text="${safe_text//$'\n'/'%0A'}"
            safe_text="${safe_text//$'\r'/'%0D'}"
            echo "::error title=Supabase start root cause tail::${safe_text}"
            exit "$code"
          fi

      - name: Confirm Supabase stack status after start
        run: npx --no-install supabase status

      - name: Replay production baseline without seeds
        run: |
          set -o pipefail
          npx --no-install supabase db reset --local --no-seed --yes --debug 2>&1 | tee supabase-reset.log

      - name: Confirm Supabase stack status after reset
        run: npx --no-install supabase status

      - name: Apply production reference data twice
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/production-reference-data.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/production-reference-data.sql

      - name: Fixture audit
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/production-fixture-audit.sql

      - name: Schema manifest
        run: node scripts/schema-manifest.cjs --local --out production-baseline-schema-manifest.json

      - name: Upload schema manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-baseline-schema-manifest
          path: production-baseline-schema-manifest.json
          if-no-files-found: error

      - name: Collect Supabase failure diagnostics
        if: failure()
        run: |
          mkdir -p production-baseline-start-diagnostics
          cp supabase-start.log production-baseline-start-diagnostics/supabase-start.log 2>/dev/null || true
          cp supabase-start-root-cause.txt production-baseline-start-diagnostics/supabase-start-root-cause.txt 2>/dev/null || true
          cp supabase-reset.log production-baseline-start-diagnostics/supabase-reset.log 2>/dev/null || true
          docker ps -a > production-baseline-start-diagnostics/docker-ps-a.txt 2>&1 || true
          docker images > production-baseline-start-diagnostics/docker-images.txt 2>&1 || true
          npx --no-install supabase status > production-baseline-start-diagnostics/supabase-status.txt 2>&1 || true
          docker ps -a --filter "name=supabase_" --format "{{.Names}}" > production-baseline-start-diagnostics/supabase-containers.txt 2>&1 || true
          while IFS= read -r container; do
            if [ -n "$container" ]; then
              docker logs --tail 300 "$container" > "production-baseline-start-diagnostics/${container}.log" 2>&1 || true
            fi
          done < production-baseline-start-diagnostics/supabase-containers.txt

      - name: Upload Supabase failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-baseline-start-diagnostics
          path: production-baseline-start-diagnostics/
          if-no-files-found: warn

      - name: Stop Supabase local stack
        if: always()
        run: npx --no-install supabase stop --no-backup
