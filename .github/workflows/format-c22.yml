name: Format C22

on:
  push:
    branches: [sprint-c22-court-ops-console]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c22-court-ops-console
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/server/repositories/admin-court-ops-repository.ts src/server/services/admin-court-ops-service.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/repositories/admin-court-ops-repository.ts src/server/services/admin-court-ops-service.ts
          git commit -m "style: format c22 backend"
          git push
