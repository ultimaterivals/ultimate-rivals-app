name: Fix C27 Legacy Setup

on:
  push:
    branches: [sprint-c27-quarter-season-foundation]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c27-quarter-season-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align legacy setup and season validation
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260810230000_quarter_season_weeks.sql')
          text = migration.read_text()
          needle = "  if p_starts_on is null then\n    raise exception 'INVALID_SEASON_START';\n  end if;\n\n  v_start := p_starts_on::timestamp at time zone 'America/Sao_Paulo';"
          replacement = "  if p_starts_on is null then\n    raise exception 'INVALID_SEASON_START';\n  end if;\n  if exists (select 1 from public.seasons where code = v_code) then\n    raise exception 'SEASON_CODE_EXISTS';\n  end if;\n\n  v_start := p_starts_on::timestamp at time zone 'America/Sao_Paulo';"
          if text.count(needle) != 1:
              raise SystemExit('migration insertion point not unique')
          migration.write_text(text.replace(needle, replacement))

          page = Path('src/app/admin/agenda/configuracao/page.tsx')
          text = page.read_text()
          old_import = '''import {
  configureCycleAction,
  createPoleAction,
  createSeasonAction,
  createVenueWithCourtAction,
} from "@/app/admin/agenda/configuracao/actions";'''
          new_import = '''import {
  createPoleAction,
  createVenueWithCourtAction,
} from "@/app/admin/agenda/configuracao/actions";'''
          if text.count(old_import) != 1:
              raise SystemExit('setup import block not unique')
          text = text.replace(old_import, new_import)

          text = text.replace(
              '["Ciclos", cycles.length],',
              '["Macros internos", cycles.length],',
              1,
          )
          text = text.replace(
              '1. Temporada → 2. revisar/configurar os 3 ciclos → 3. polos → 4.\n              locais + primeira quadra → 5. somente depois abrir oportunidades,\n              eventos e sessões UR Play.',
              '1. Temporada de 13 semanas → 2. polos → 3. locais + primeira\n              quadra → 4. homologação da infraestrutura → 5. somente depois\n              abrir oportunidades, eventos e sessões UR Play.',
              1,
          )

          start_marker = '''      <section className="grid gap-4 xl:grid-cols-2">
        <Card>
          <div className="mb-5">
            <Badge>1 · Temporada</Badge>'''
          next_marker = '''      <section className="grid gap-4 xl:grid-cols-2">
        <Card>
          <div className="mb-5">
            <Badge>3 · Polos</Badge>'''
          start = text.find(start_marker)
          next_start = text.find(next_marker)
          if start < 0 or next_start < 0 or next_start <= start:
              raise SystemExit('setup season section markers not found')
          replacement_section = '''      <Card className="border-ur-gold/25">
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div>
            <Badge>1 · Temporada</Badge>
            <h2 className="font-display mt-3 text-xl font-black uppercase">
              Temporada operacional de 13 semanas
            </h2>
            <p className="mt-2 max-w-3xl text-sm leading-6 text-zinc-500">
              A temporada não é mais criada neste setup legado. W1–W13 são a
              fonte oficial do trimestre; os três macro-ciclos abaixo existem
              somente para compatibilidade técnica com módulos antigos.
            </p>
          </div>
          <Link
            href="/admin/agenda/temporada"
            className="bg-ur-gold text-ur-black rounded-ur px-4 py-3 text-sm font-black"
          >
            Abrir temporada 13 semanas
          </Link>
        </div>
      </Card>

'''
          text = text[:start] + replacement_section + text[next_start:]
          page.write_text(text)
          PY
      - run: npx prettier --write src/app/admin/agenda/configuracao/page.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260810230000_quarter_season_weeks.sql src/app/admin/agenda/configuracao/page.tsx
          git commit -m "fix: retire legacy season creation path"
          git push
