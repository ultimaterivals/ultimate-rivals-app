name: App V1 Market Format Once

on:
  push:
    branches:
      - integration/app-v1-command-data

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/app-v1-command-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/athlete/market/page.tsx src/app/admin/market/page.tsx src/lib/auth/admin-modules.ts src/lib/auth/admin-modules.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/athlete/market/page.tsx src/app/admin/market/page.tsx src/lib/auth/admin-modules.ts src/lib/auth/admin-modules.test.ts
          git commit -m "style: format UR Market integration"
          git push origin HEAD:integration/app-v1-command-data
