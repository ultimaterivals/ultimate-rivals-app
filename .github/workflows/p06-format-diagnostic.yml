name: P06 Format Diagnostic

on:
  push:
    branches:
      - feat/athlete-app-p06-season-campaign

permissions:
  contents: write

jobs:
  prettier-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/athlete-app-p06-season-campaign
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply canonical Prettier formatting
        run: npx prettier --write src/app/athlete/season/page.tsx
      - name: Commit canonical formatting when needed
        run: |
          if git diff --quiet -- src/app/athlete/season/page.tsx; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/athlete/season/page.tsx
          git commit -m "style: apply canonical P06 formatting"
          git push origin HEAD:feat/athlete-app-p06-season-campaign
