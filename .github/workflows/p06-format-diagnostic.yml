name: P06 Format Diagnostic

on:
  push:
    branches:
      - feat/athlete-app-p06-season-campaign

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Produce canonical Prettier diff
        run: |
          npx prettier --write src/app/athlete/season/page.tsx
          echo '--- PRETTIER DIFF START ---'
          git diff -- src/app/athlete/season/page.tsx
          echo '--- PRETTIER DIFF END ---'
