name: Patch C34 Render Time

on:
  push:
    branches:
      - sprint-c34-post-session-360

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c34-post-session-360
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/app/admin/ur-play/pos-sessao/page.tsx")
          text = path.read_text()
          old = 'new Date(task.dueAt).getTime() < Date.now();'
          new = 'new Date(task.dueAt).getTime() < new Date(snapshot.generatedAt).getTime();'
          if old not in text:
              raise SystemExit("expected Date.now expression not found")
          path.write_text(text.replace(old, new))
          PY
      - run: >-
          npx prettier --write
          src/features/admin-ur-play-post-session/types.ts
          src/server/services/admin-ur-play-post-session-service.ts
          src/app/admin/ur-play/pos-sessao/page.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin-ur-play-post-session/types.ts \
            src/server/services/admin-ur-play-post-session-service.ts \
            src/app/admin/ur-play/pos-sessao/page.tsx
          git commit -m "fix: make C34 render time deterministic" || exit 0
          git push
