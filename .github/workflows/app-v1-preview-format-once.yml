name: App V1 Preview Format Once

on:
  push:
    branches:
      - integration/app-v1-command-data

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/app-v1-command-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format preview integration
        run: npx prettier --write src/lib/auth/athlete-preview-policy.ts src/lib/auth/athlete-viewer.ts src/features/admin-athlete-preview/actions.ts src/app/admin/preview/page.tsx src/lib/auth/admin-modules.ts src/server/services/athlete-viewer-snapshot-service.ts src/components/athlete/athlete-shell.tsx src/app/athlete/layout.tsx src/app/athlete/page.tsx src/app/athlete/agenda/page.tsx src/app/athlete/ranking/page.tsx src/app/athlete/season/page.tsx src/app/athlete/arenas/page.tsx src/app/athlete/wallet/page.tsx src/app/athlete/development/page.tsx src/app/athlete/highlights/page.tsx src/app/athlete/market/page.tsx src/app/athlete/perfil/page.tsx src/server/repositories/athlete-availability-repository.ts src/server/services/athlete-availability-service.ts src/app/athlete/disponibilidade/page.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: format athlete preview integration"
          git push origin HEAD:integration/app-v1-command-data
