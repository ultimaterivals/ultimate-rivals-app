name: P03 Format Once

on:
  push:
    branches:
      - feat/athlete-app-p03-jogar

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/athlete/agenda/page.tsx src/components/athlete/athlete-opportunity-card.tsx src/app/athlete/disponibilidade/actions.ts
      - uses: actions/upload-artifact@v4
        with:
          name: p03-formatted-files
          path: |
            src/app/athlete/agenda/page.tsx
            src/components/athlete/athlete-opportunity-card.tsx
            src/app/athlete/disponibilidade/actions.ts
