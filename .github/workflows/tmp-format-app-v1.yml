name: App V1 One-shot Formatter

on:
  push:
    branches:
      - integration/app-v1-command-data
    paths:
      - ".github/workflows/tmp-format-app-v1.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/app-v1-command-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository formatter and remove one-shot workflow
        run: |
          npx prettier --write src/app/athlete/perfil/page.tsx tests/e2e/visual-uat.spec.ts
          rm .github/workflows/tmp-format-app-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/athlete/perfil/page.tsx tests/e2e/visual-uat.spec.ts .github/workflows/tmp-format-app-v1.yml
          git commit -m "style: apply formatter to App V1 final mobile fix"
          git push origin HEAD:integration/app-v1-command-data
