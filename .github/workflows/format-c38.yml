name: Format C38
on:
  push:
    branches:
      - sprint-c38-incidents-safety-desk
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c38-incidents-safety-desk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/admin-ur-play-incidents/types.ts src/server/repositories/admin-ur-play-incidents-repository.ts src/server/services/admin-ur-play-incidents-service.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin-ur-play-incidents/types.ts src/server/repositories/admin-ur-play-incidents-repository.ts src/server/services/admin-ur-play-incidents-service.ts
          git commit -m "chore: format C38 incident desk" || exit 0
          git push
