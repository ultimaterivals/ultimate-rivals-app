name: Format C34

on:
  push:
    branches:
      - sprint-c34-post-session-360

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c34-post-session-360
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          src/features/admin-ur-play-post-session/types.ts
          src/server/repositories/admin-ur-play-post-session-repository.ts
          src/server/services/admin-ur-play-post-session-service.ts
          src/server/services/admin-ur-play-post-session-service.test.ts
          src/app/admin/ur-play/pos-sessao/actions.ts
          src/app/admin/ur-play/pos-sessao/page.tsx
          src/app/admin/ur-play/layout.tsx
          src/components/admin/command-launch-desk.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin-ur-play-post-session/types.ts \
            src/server/repositories/admin-ur-play-post-session-repository.ts \
            src/server/services/admin-ur-play-post-session-service.ts \
            src/server/services/admin-ur-play-post-session-service.test.ts \
            src/app/admin/ur-play/pos-sessao/actions.ts \
            src/app/admin/ur-play/pos-sessao/page.tsx \
            src/app/admin/ur-play/layout.tsx \
            src/components/admin/command-launch-desk.tsx
          git commit -m "chore: format C34 sources" || exit 0
          git push
