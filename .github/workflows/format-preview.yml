name: Format Preview

on:
  push:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write src/app/admin/equipes/actions.ts src/app/admin/equipes/page.tsx
          git diff -- src/app/admin/equipes/actions.ts src/app/admin/equipes/page.tsx
