name: P07 Contract Fix

on:
  push:
    branches:
      - feat/athlete-app-p07-development-evidence

permissions:
  contents: write

jobs:
  contract-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/athlete-app-p07-development-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align contract
        env:
          REPLACEMENT_B64: 
        run: python -c 'import base64,os; from pathlib import Path; p=Path("src/lib/app-command-integration-contract.test.ts"); t=p.read_text(); s=t.index("  it(\"keeps the complete athlete progression loop tied to canonical economy\""); e=t.index("  it(\"keeps the league ranking visible",s); r=base64.b64decode(os.environ["REPLACEMENT_B64"]).decode(); p.write_text(t[:s]+r+t[e:])'
      - run: npx prettier --write src/lib/app-command-integration-contract.test.ts
      - run: npm run test -- src/lib/app-command-integration-contract.test.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/app-command-integration-contract.test.ts
          git commit -m "test: align progression contract with P07 separation"
          git push origin HEAD:feat/athlete-app-p07-development-evidence
