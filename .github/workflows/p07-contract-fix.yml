name: P07 Contract Fix

on:
  push:
    branches:
      - feat/athlete-app-p07-development-evidence

permissions:
  contents: write

jobs:
  contract-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/athlete-app-p07-development-evidence
      - name: Align stale progression contract with P07 separation
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/lib/app-command-integration-contract.test.ts")
          text = path.read_text()
          old = '''  it("keeps the complete athlete progression loop tied to canonical economy", () => {
            const development = source("src/app/athlete/development/page.tsx");
            const playerHub = source("src/app/athlete/page.tsx");
            const athleteRepository = source(
              "src/server/repositories/athlete-portal-repository.ts",
            );

            for (const stage of [
              "Jogar",
              "Ganhar pontos",
              "Subir no ranking",
              "Cumprir missões",
              "Ganhar UR Coins",
              "Desbloquear e resgatar",
              "Evoluir",
              "Jogar novamente",
            ]) {
              expect(development).toContain(stage);
            }
            expect(development).toContain("/athlete/market");
            expect(development).toContain("/athlete/wallet");
            expect(development).toContain("não são simulados nesta V1");
            expect(playerHub).toContain("Como chegar lá");
            expect(athleteRepository).toContain("athlete_development_summary");
            expect(playerHub).toContain("Último destaque");
          });'''
          new = '''  it("keeps athlete progression canonical while Evolution stays separate from Hunter and economy", () => {
            const development = source("src/app/athlete/development/page.tsx");
            const playerHub = source("src/app/athlete/page.tsx");
            const athleteRepository = source(
              "src/server/repositories/athlete-portal-repository.ts",
            );

            expect(development).toContain("Evolução esportiva");
            expect(development).toContain("Hunter permanece uma área separada e opcional");
            expect(development).toContain('from("match_technical_summary")');
            expect(development).toContain("resultados homologados");
            expect(development).toContain("Série histórica ainda não publicada");
            expect(development).toContain("/athlete/hunter");
            expect(development).not.toContain("/athlete/market");
            expect(development).not.toContain("/athlete/wallet");
            expect(development).not.toContain("hunterMission");
            expect(playerHub).toContain("Como chegar lá");
            expect(athleteRepository).toContain("athlete_development_summary");
            expect(playerHub).toContain("Último destaque");
          });'''
          if old not in text:
              raise SystemExit("Expected stale progression contract block not found")
          path.write_text(text.replace(old, new, 1))
      - name: Format contract test
        run: npx prettier --write src/lib/app-command-integration-contract.test.ts
      - name: Commit contract alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/app-command-integration-contract.test.ts
          git commit -m "test: align progression contract with P07 separation"
          git push origin HEAD:feat/athlete-app-p07-development-evidence
