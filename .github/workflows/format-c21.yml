name: Format C21
on:
  push:
    branches: [sprint-c21-pole-region-infrastructure]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c21-pole-region-infrastructure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "src/app/admin/agenda/layout.tsx" "src/app/admin/agenda/polos/actions.ts" "src/app/admin/agenda/polos/page.tsx" "src/server/repositories/admin-poles-infrastructure-repository.ts" "src/server/services/admin-poles-infrastructure-service.ts"
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format c21 files"
          git push
