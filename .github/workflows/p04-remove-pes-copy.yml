name: P04 Remove PES Copy Once

on:
  push:
    branches:
      - feat/athlete-app-p04-ranking-career-race

permissions:
  contents: write

jobs:
  remove-copy:
    if: github.event.head_commit.message != 'chore: remove PES example copy from Player Hub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/athlete-app-p04-ranking-career-race
      - name: Remove example copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/athlete/page.tsx')
          text = path.read_text()
          old = '<p className="text-[.65rem] font-black tracking-[.24em] text-ur-gold uppercase">Rumo ao estrelato</p>'
          new = '<p className="text-[.65rem] font-black tracking-[.24em] text-ur-gold uppercase">Sua carreira UR</p>'
          if old not in text:
              raise SystemExit('Target copy not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "ultimaterivals"
          git config user.email "ultimaterivalsbr@gmail.com"
          git add src/app/athlete/page.tsx
          git commit -m "chore: remove PES example copy from Player Hub"
          git push origin HEAD:feat/athlete-app-p04-ranking-career-race
