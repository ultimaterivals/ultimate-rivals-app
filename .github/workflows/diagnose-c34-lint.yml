name: Diagnose C34 Lint

on:
  push:
    branches:
      - sprint-c34-post-session-360

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c34-post-session-360
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint > C34_LINT.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add C34_LINT.txt
          git commit -m "chore: capture C34 lint diagnostics" || exit 0
          git push
