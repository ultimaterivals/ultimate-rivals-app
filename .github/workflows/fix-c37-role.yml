name: Fix C37 Role
on:
  push:
    branches:
      - sprint-c37-retention-engine
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c37-retention-engine
      - run: sed -i 's/identity\.roles\.includes("admin")/identity.role === "admin"/' src/app/admin/ur-play/retencao/page.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/ur-play/retencao/page.tsx
          git commit -m "fix: use singular admin role in C37 retention desk" || exit 0
          git push
