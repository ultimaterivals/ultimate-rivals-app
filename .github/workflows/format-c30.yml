name: Format C30
on:
  push:
    branches:
      - sprint-c30-command-launch-desk
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c30-command-launch-desk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/admin/command-launch-desk.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/command-launch-desk.tsx
          git commit -m "chore: format c30 launch desk" || exit 0
          git push
