name: Format C24

on:
  push:
    branches: [sprint-c24-athlete-activation-waves]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c24-athlete-activation-waves
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/admin/atletas/ondas/actions.ts src/app/admin/atletas/ondas/page.tsx src/server/services/admin-athlete-waves-service.test.ts src/server/services/admin-athlete-waves-service.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/atletas/ondas/actions.ts src/app/admin/atletas/ondas/page.tsx src/server/services/admin-athlete-waves-service.test.ts src/server/services/admin-athlete-waves-service.ts
          git commit -m "style: format c24 files"
          git push
