name: Format C3

on:
  push:
    branches:
      - sprint-c3-athlete-portal-core

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sprint-c3-athlete-portal-core
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Prettier
        run: npm run format
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs README.md package.json '*.config.*'
          git commit -m "style: format athlete portal C3"
          git push origin HEAD:sprint-c3-athlete-portal-core
