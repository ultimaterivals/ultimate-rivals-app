name: Dependency Safe Fix

on:
  push:
    branches:
      - security-gate-dependency-audit

permissions:
  contents: write

jobs:
  safe-fix:
    if: github.event.head_commit.message != 'chore: apply safe dependency fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-gate-dependency-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply compatible fixes only
        run: npm audit fix
      - name: Commit lockfile changes
        shell: bash
        run: |
          if git diff --quiet package.json package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: apply safe dependency fixes"
          git push origin HEAD:security-gate-dependency-audit
