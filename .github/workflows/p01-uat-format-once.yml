name: P01 UAT Format Once

on:
  push:
    branches:
      - feat/athlete-app-p01-shell-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/athlete-app-p01-shell-v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format UAT spec
        run: npx prettier --write tests/e2e/visual-uat.spec.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-uat.spec.ts
          git commit -m "style: format P01 visual UAT spec"
          git push origin HEAD:feat/athlete-app-p01-shell-v2
