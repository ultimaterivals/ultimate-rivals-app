name: Fix C35 Idempotency

on:
  push:
    branches:
      - sprint-c35-ur-coins-evidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c35-ur-coins-evidence
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260811030000_ur_play_coins_by_evidence.sql')
          text = path.read_text()
          old_participation = "v_key := concat_ws(':','urc',target_session,v_entitlement.match_id,v_entitlement.athlete_id,v_participation.code,v_fingerprint);"
          new_participation = "v_key := concat_ws(':','urc',target_session,v_entitlement.match_id,v_entitlement.athlete_id,v_participation.code,'run',v_run.id);"
          old_result = "v_key := concat_ws(':','urc',target_session,v_entitlement.match_id,v_entitlement.athlete_id,v_result_rule.code,v_fingerprint);"
          new_result = "v_key := concat_ws(':','urc',target_session,v_entitlement.match_id,v_entitlement.athlete_id,v_result_rule.code,'run',v_run.id);"
          if old_participation not in text or old_result not in text:
              raise SystemExit('expected generated idempotency keys not found')
          text = text.replace(old_participation, new_participation, 1)
          text = text.replace(old_result, new_result, 1)
          path.write_text(text)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260811030000_ur_play_coins_by_evidence.sql
          git commit -m "fix: make coin generation idempotent across recurring states" || exit 0
          git push
