name: Format C6
on:
  push:
    branches: [sprint-c6-commercial-command]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c6-commercial-command
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs README.md package.json '*.config.*'
          git commit -m "style: format commercial C6"
          git push origin HEAD:sprint-c6-commercial-command
