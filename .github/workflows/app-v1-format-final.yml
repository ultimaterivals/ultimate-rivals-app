name: App V1 Final Format

on:
  push:
    branches:
      - integration/app-v1-command-data
    paths:
      - ".github/workflows/app-v1-format-final.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository formatter and remove helper workflow
        run: |
          npm run format
          rm .github/workflows/app-v1-format-final.yml
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format final App V1 polish"
          git push
