name: Format C18 Final
on:
  push:
    branches: [sprint-c18-athlete-first-access]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c18-athlete-first-access
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "src/app/admin/atletas/acessos/invite-form.tsx" "src/app/admin/atletas/acessos/page.tsx" "src/components/ui/button.tsx"
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format final c18 files"
          git push
