name: App V1 Reservation E2E Format Once

on:
  push:
    branches:
      - integration/app-v1-command-data
    paths:
      - ".github/workflows/app-v1-reservation-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/app-v1-command-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/authenticated-app.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/authenticated-app.spec.ts
          git commit -m "style: format reservation e2e"
          git push
