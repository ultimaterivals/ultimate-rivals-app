name: Format C28

on:
  push:
    branches: [sprint-c28-pilot-setup-assistant]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c28-pilot-setup-assistant
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/admin/agenda/layout.tsx src/app/admin/agenda/piloto/actions.ts src/app/admin/agenda/piloto/page.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add src/app/admin/agenda/layout.tsx src/app/admin/agenda/piloto/actions.ts src/app/admin/agenda/piloto/page.tsx
          git commit -m "chore: format c28 sources"
          git push
