name: Align C29 Confirmation

on:
  push:
    branches: [sprint-c29-retire-legacy-season-api]

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c29-retire-legacy-season-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align confirmation page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/admin/agenda/confirmacao/page.tsx')
          text = path.read_text()

          old = 'import { ArrowLeft, CalendarCheck2, ShieldCheck } from "lucide-react";'
          new = 'import { ArrowLeft, CalendarCheck2, CheckCircle2, CircleAlert } from "lucide-react";'
          if text.count(old) != 1:
              raise SystemExit('icon import mismatch')
          text = text.replace(old, new)

          old = '''import {
            confirmUrPlayOpportunityAction,
            homologateSeasonAction,
          } from "@/app/admin/agenda/confirmacao/actions";'''.replace('          ', '')
          new = 'import { confirmUrPlayOpportunityAction } from "@/app/admin/agenda/confirmacao/actions";'
          if text.count(old) != 1:
              raise SystemExit('action import mismatch')
          text = text.replace(old, new)

          needle = 'import { getAdminOperationalSetupSnapshot } from "@/server/services/admin-operational-setup-service";\n'
          addition = needle + 'import { getAdminQuarterSeasonSnapshot } from "@/server/services/admin-quarter-season-service";\n'
          if text.count(needle) != 1:
              raise SystemExit('service import mismatch')
          text = text.replace(needle, addition)

          old = '''  const [setup, confirmation, params] = await Promise.all([
    getAdminOperationalSetupSnapshot(),
    getAdminSessionConfirmationSnapshot(),
    searchParams,
  ]);'''
          new = '''  const [setup, quarter, confirmation, params] = await Promise.all([
    getAdminOperationalSetupSnapshot(),
    getAdminQuarterSeasonSnapshot(),
    getAdminSessionConfirmationSnapshot(),
    searchParams,
  ]);'''
          if text.count(old) != 1:
              raise SystemExit('Promise.all block mismatch')
          text = text.replace(old, new)

          old = '''  const seasons = setup.seasons ?? [];
  const cycles = setup.cycles ?? [];
  const poles = setup.poles ?? [];
  const venues = setup.venues ?? [];
  const courts = setup.courts ?? [];
  const opportunities = confirmation.opportunities ?? [];
  const readySeasons = seasons.filter((season) =>
    ["registration", "active"].includes(season.status),
  );'''
          new = '''  const cycles = setup.cycles ?? [];
  const poles = setup.poles ?? [];
  const venues = setup.venues ?? [];
  const courts = setup.courts ?? [];
  const opportunities = confirmation.opportunities ?? [];
  const season = quarter.currentSeason;
  const seasonReady = Boolean(
    season?.structureReady && ["registration", "active"].includes(season.status),
  );
  const readySeasonIds = new Set(seasonReady && season ? [season.id] : []);'''
          if text.count(old) != 1:
              raise SystemExit('local data block mismatch')
          text = text.replace(old, new)

          # Remove stale success card from pre-C27 flow.
          start = text.find('      {success === "season_homologated" && (')
          if start >= 0:
              end = text.find('      {error && (', start)
              if end < 0:
                  raise SystemExit('success card end not found')
              text = text[:start] + text[end:]

          # Replace the old season/cycle section with the W1-W13 gate.
          start_marker = '''      <section className="grid gap-4">
        <div>
          <h2 className="font-display text-xl font-black uppercase">
            Temporadas
          </h2>'''
          next_marker = '''      <section className="grid gap-4">
        <div>
          <h2 className="font-display text-xl font-black uppercase">
            Demandas aguardando confirmação
          </h2>'''
          start = text.find(start_marker)
          end = text.find(next_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('season section markers not found')
          replacement = '''      <section className="grid gap-4">
        <div>
          <h2 className="font-display text-xl font-black uppercase">
            Temporada operacional
          </h2>
          <p className="mt-1 text-sm text-zinc-500">
            W1–W13 são a estrutura oficial. Esta tela apenas confirma sessões dentro de uma temporada já homologada.
          </p>
        </div>
        {!season ? (
          <Card>
            <div className="flex items-start gap-3">
              <CircleAlert className="mt-0.5 text-amber-300" size={18} aria-hidden="true" />
              <div>
                <p className="font-bold">Nenhuma temporada trimestral criada.</p>
                <p className="mt-1 text-sm text-zinc-500">
                  Crie e homologue W1–W13 antes de converter uma oportunidade em sessão oficial.
                </p>
                <Link
                  href="/admin/agenda/temporada"
                  className="text-ur-gold mt-3 inline-block text-sm font-bold"
                >
                  Abrir temporada 13 semanas →
                </Link>
              </div>
            </div>
          </Card>
        ) : (
          <Card className={seasonReady ? "border-emerald-500/25" : "border-amber-500/25"}>
            <div className="flex flex-wrap items-start justify-between gap-4">
              <div className="flex items-start gap-3">
                {seasonReady ? (
                  <CheckCircle2 className="mt-0.5 text-emerald-400" size={18} aria-hidden="true" />
                ) : (
                  <CircleAlert className="mt-0.5 text-amber-300" size={18} aria-hidden="true" />
                )}
                <div>
                  <p className="font-bold">{season.name}</p>
                  <p className="mt-1 text-sm text-zinc-500">
                    {season.weeks.length}/13 semanas · status {season.status}
                    {season.currentWeek ? ` · W${season.currentWeek.weekNumber} ${season.currentWeek.name}` : ""}
                  </p>
                  <p className="mt-2 text-xs leading-5 text-zinc-600">
                    Os 3 macro-ciclos abaixo existem somente para compatibilidade técnica ao vincular a sessão.
                  </p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <Badge>{seasonReady ? "homologada" : "pendente"}</Badge>
                <Link
                  href={`/admin/agenda/temporada?season=${season.id}`}
                  className="rounded-ur border px-3 py-2 text-xs font-bold text-zinc-300"
                >
                  Revisar temporada
                </Link>
              </div>
            </div>
          </Card>
        )}
      </section>

'''
          text = text[:start] + replacement + text[end:]

          text = text.replace(
              'const season = readySeasons.find(\n                  (item) => item.id === cycle.seasonId,\n                );\n                return (\n                  season &&',
              'return (\n                  readySeasonIds.has(cycle.seasonId) &&',
              1,
          )
          text = text.replace(
              'Nenhum ciclo homologado cobre integralmente esta data.\n                          Ajuste a temporada/ciclos antes de confirmar.',
              'Nenhum macro interno compatível cobre integralmente esta data. Revise a temporada de 13 semanas antes de confirmar.',
              1,
          )
          text = text.replace('Temporada / ciclo', 'Macro interno compatível', 1)

          old_option = '''                            {validCycles.map((cycle) => {
                              const season = readySeasons.find(
                                (item) => item.id === cycle.seasonId,
                              );
                              return (
                                <option key={cycle.id} value={cycle.id}>
                                  {season?.name ?? "Temporada"} · C
                                  {cycle.cycleNumber} · {cycle.name}
                                </option>
                              );
                            })}'''
          new_option = '''                            {validCycles.map((cycle) => (
                              <option key={cycle.id} value={cycle.id}>
                                {season?.name ?? "Temporada"} · {cycle.name}
                              </option>
                            ))}'''
          if text.count(old_option) != 1:
              raise SystemExit('cycle option block mismatch')
          text = text.replace(old_option, new_option)

          # Retire stale errors that described three cycles as the official season model.
          text = text.replace('  SEASON_NOT_FOUND: "Temporada não encontrada.",\n', '')
          text = text.replace('  SEASON_NOT_HOMOLOGATABLE: "A temporada não está em estado homologável.",\n', '')
          text = text.replace('  SEASON_REQUIRES_THREE_CYCLES:\n    "A temporada precisa ter exatamente três ciclos.",\n', '')
          text = text.replace('  INVALID_SEASON_CYCLE_PERIOD: "Existe ciclo fora do período da temporada.",\n', '')
          text = text.replace('  SEASON_CYCLES_OVERLAP: "Os ciclos da temporada estão sobrepostos.",\n', '')
          text = text.replace('  SEASON_CYCLE_NOT_FOUND: "Ciclo não encontrado para a temporada.",\n', '  SEASON_CYCLE_NOT_FOUND: "Macro interno compatível não encontrado para a temporada.",\n')
          text = text.replace('  SEASON_CYCLE_NOT_READY: "O ciclo ainda não pode receber sessões.",\n', '  SEASON_CYCLE_NOT_READY: "O macro interno ainda não pode receber sessões.",\n')
          text = text.replace('  OPPORTUNITY_OUTSIDE_CYCLE:\n    "O UR Play precisa ficar integralmente dentro do ciclo selecionado.",\n', '  OPPORTUNITY_OUTSIDE_CYCLE:\n    "O UR Play precisa ficar integralmente dentro do macro interno compatível.",\n')

          path.write_text(text)
          PY
      - run: npx prettier --write src/app/admin/agenda/confirmacao/page.tsx src/app/admin/agenda/confirmacao/actions.ts src/app/admin/agenda/configuracao/actions.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/agenda/confirmacao/page.tsx src/app/admin/agenda/confirmacao/actions.ts src/app/admin/agenda/configuracao/actions.ts
          git commit -m "refactor: align confirmation with 13-week season"
          git push
