name: P04 Format Once

on:
  push:
    branches:
      - feat/athlete-app-p04-ranking-career-race

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/athlete/ranking/page.tsx tests/e2e/visual-uat.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: p04-formatted-files
          path: |
            src/app/athlete/ranking/page.tsx
            tests/e2e/visual-uat.spec.ts
