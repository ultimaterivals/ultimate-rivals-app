name: C42 Auto Format

on:
  push:
    branches:
      - c42-command-final-audit-control-room

permissions:
  contents: write

concurrency:
  group: c42-auto-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: c42-command-final-audit-control-room

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format C42 sources
        run: >-
          npx prettier --write
          src/app/admin/page.tsx
          src/components/admin/command-today-control-room.tsx
          src/components/admin/command-ur-play-cycle-control.tsx
          src/components/admin/command-session-margin-control.tsx
          src/components/admin/command-session-action-desk.tsx
          src/components/admin/command-source-audit.tsx
          docs/command-c42-final-audit.md

      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/page.tsx src/components/admin/command-today-control-room.tsx src/components/admin/command-ur-play-cycle-control.tsx src/components/admin/command-session-margin-control.tsx src/components/admin/command-session-action-desk.tsx src/components/admin/command-source-audit.tsx docs/command-c42-final-audit.md
          git commit -m "style: format C42 command sources"
          git push origin HEAD:c42-command-final-audit-control-room
