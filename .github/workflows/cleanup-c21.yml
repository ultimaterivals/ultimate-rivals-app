name: Cleanup C21 Temporary Workflows
on:
  push:
    branches: [sprint-c21-pole-region-infrastructure]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c21-pole-region-infrastructure
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/format-c21.yml .github/workflows/cleanup-c21.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove c21 temporary workflows"
          git push
