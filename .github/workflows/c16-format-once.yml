name: C16 Format Once

on:
  push:
    branches:
      - sprint-c16-confirm-ur-play-session

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c16-confirm-ur-play-session
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format C16 files
        run: npx prettier --write src/app/admin/agenda/confirmacao/page.tsx src/server/services/admin-session-confirmation-service.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/agenda/confirmacao/page.tsx src/server/services/admin-session-confirmation-service.ts
          git commit -m "style: format C16 sources"
          git push origin HEAD:sprint-c16-confirm-ur-play-session
