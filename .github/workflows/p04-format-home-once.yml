name: P04 Format Player Hub Once

on:
  push:
    branches:
      - feat/athlete-app-p04-ranking-career-race

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/athlete/page.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: p04-formatted-player-hub
          path: src/app/athlete/page.tsx
