name: Run C29 Align
on:
  push:
    branches:
      - sprint-c29-retire-legacy-season-api
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c29-retire-legacy-season-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/align-c29-confirmation.py
      - run: npx prettier --write src/app/admin/agenda/confirmacao/page.tsx src/app/admin/agenda/confirmacao/actions.ts src/app/admin/agenda/configuracao/actions.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/agenda/confirmacao/page.tsx src/app/admin/agenda/confirmacao/actions.ts src/app/admin/agenda/configuracao/actions.ts
          git commit -m "refactor: align confirmation with 13-week season" || exit 0
          git push
