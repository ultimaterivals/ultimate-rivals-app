name: Format C19
on:
  push:
    branches: [sprint-c19-athlete-import-staging]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c19-athlete-import-staging
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "src/app/admin/atletas/importacao/actions.ts" "src/app/admin/atletas/importacao/page.tsx" "src/server/repositories/admin-athlete-import-repository.ts" "src/server/services/admin-athlete-import-service.ts" "src/app/admin/atletas/layout.tsx"
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format c19 files"
          git push
