name: Apply Admin Athlete Mirror

on:
  push:
    branches:
      - feature/admin-control-center-athlete-mirror
    paths:
      - .github/workflows/apply-admin-mirror.yml
      - scripts/apply-admin-mirror.mjs
      - scripts/fix-admin-mirror-lint.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-admin-mirror.mjs
      - run: node scripts/fix-admin-mirror-lint.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add admin control center athlete mirror"
          git push origin HEAD:feature/admin-control-center-athlete-mirror
