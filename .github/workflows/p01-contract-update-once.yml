name: P01 Contract Update Once

on:
  push:
    branches:
      - feat/athlete-app-p01-shell-v2

permissions:
  contents: write

jobs:
  update-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/athlete-app-p01-shell-v2
      - name: Update shell contract for approved P01 architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/app-command-integration-contract.test.ts')
          text = path.read_text()
          old = '''    expect(athleteShell).toContain("Meu jogo");\n    expect(athleteShell).toContain("Minha jornada");\n    expect(athleteShell).toContain("Ecossistema");\n    expect(athleteShell).toContain('aria-label="Mais opções do atleta"');\n    expect(athleteShell).toContain("Feedback e suporte");'''
          new = '''    expect(athleteShell).toContain("Carreira");\n    expect(athleteShell).toContain("Ecossistema");\n    expect(athleteShell).toContain('aria-label="Navegação principal do atleta"');\n    expect(athleteShell).toContain('aria-label="Atalhos da área atual"');\n    for (const destination of ["Início", "Jogar", "Ranking", "Hunter", "Perfil"]) {\n      expect(athleteShell).toContain(`label: "${destination}"`);\n    }\n    expect(athleteShell).toContain("/athlete/feedback");'''
          if old not in text:
              raise SystemExit('Expected legacy shell contract block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format updated test
        run: |
          npm ci
          npx prettier --write src/lib/app-command-integration-contract.test.ts
      - name: Commit contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/app-command-integration-contract.test.ts
          git commit -m "test: align AthleteShell contract with P01 navigation"
          git push origin HEAD:feat/athlete-app-p01-shell-v2
