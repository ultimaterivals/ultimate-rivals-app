name: P05 Format Helper

on:
  push:
    branches:
      - feat/athlete-app-p05-results-career-history

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format P05 files
        run: npx prettier --write src/components/athlete/athlete-results-content.tsx src/components/athlete/athlete-live-results.tsx src/components/athlete/athlete-historical-results.tsx
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/athlete/athlete-results-content.tsx src/components/athlete/athlete-live-results.tsx src/components/athlete/athlete-historical-results.tsx
          git commit -m "style: format P05 career results"
          git push
