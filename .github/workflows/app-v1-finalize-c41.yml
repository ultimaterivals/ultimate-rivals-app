name: App V1 Finalize C41 Sync

on:
  push:
    branches:
      - integration/app-v1-command-data
    paths:
      - .github/workflows/app-v1-finalize-c41.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/app-v1-command-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Retimestamp App V1 migrations after C41 and preserve athlete feedback
        shell: bash
        run: |
          set -euo pipefail

          cmp supabase/migrations/20260811061500_atomic_urc_market_redemption.sql supabase/migrations/20260811081000_atomic_urc_market_redemption.sql
          rm supabase/migrations/20260811061500_atomic_urc_market_redemption.sql

          cmp supabase/migrations/20260811061600_fix_reservation_credit_lock.sql supabase/migrations/20260811081100_fix_reservation_credit_lock.sql
          rm supabase/migrations/20260811061600_fix_reservation_credit_lock.sql

          git mv supabase/migrations/20260811061700_restore_ur_play_reservation_registration_sync.sql supabase/migrations/20260811081200_restore_ur_play_reservation_registration_sync.sql
          git mv supabase/migrations/20260811061800_reuse_confirmed_ur_play_registration_on_reservation.sql supabase/migrations/20260811081300_reuse_confirmed_ur_play_registration_on_reservation.sql
          git mv supabase/migrations/20260811061900_allow_consumed_activity_reservation_status.sql supabase/migrations/20260811081400_allow_consumed_activity_reservation_status.sql
          git mv supabase/migrations/20260811062000_admin_fulfill_market_redemption.sql supabase/migrations/20260811081500_admin_fulfill_market_redemption.sql

          python - <<'PY'
          from pathlib import Path

          test = Path('src/lib/app-command-integration-contract.test.ts')
          text = test.read_text()
          replacements = {
              '20260811061500': '20260811081000',
              '20260811061600': '20260811081100',
              '20260811061700': '20260811081200',
              '20260811061800': '20260811081300',
              '20260811061900': '20260811081400',
              '20260811062000': '20260811081500',
              'it("keeps all App V1 migrations forward-only after C39"': 'it("keeps all App V1 migrations forward-only after current main C41"',
              'const c39 = source(\n      "supabase/migrations/20260811061000_private_ur_play_development_mutations.sql",\n    );': 'const c41 = source(\n      "supabase/migrations/20260811080500_fix_feedback_private_execute.sql",\n    );',
              'expect(c39).toContain("ur_play");': 'expect(c41).toContain("feedback");',
              '> "20260811061000"': '> "20260811080500"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          test.write_text(text)

          shell = Path('src/components/athlete/athlete-shell.tsx')
          text = shell.read_text()
          if 'MessageSquareText' not in text:
              text = text.replace('  MapPin,\n  Medal,', '  MapPin,\n  MessageSquareText,\n  Medal,')
          if '/athlete/feedback' not in text:
              text = text.replace(
                  '  { href: "/athlete/highlights", label: "Destaques", icon: Clapperboard },',
                  '  { href: "/athlete/highlights", label: "Destaques", icon: Clapperboard },\n  { href: "/athlete/feedback", label: "Feedback UR", icon: MessageSquareText },',
              )
          text = text.replace(
              'function DesktopNavigation() {',
              'function DesktopNavigation({ preview = false }: { preview?: boolean }) {',
          )
          text = text.replace(
              '{journey.map(({ href, label, icon: Icon }) => (',
              '{journey\n            .filter((item) => !preview || item.href !== "/athlete/feedback")\n            .map(({ href, label, icon: Icon }) => (',
          )
          text = text.replace(
              '<DesktopNavigation />',
              '<DesktopNavigation preview={Boolean(preview)} />',
          )
          shell.write_text(text)
          PY

          npx prettier --write src/lib/app-command-integration-contract.test.ts src/components/athlete/athlete-shell.tsx
          git rm .github/workflows/app-v1-finalize-c41.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize App V1 migration order after C41"
          git push origin HEAD:integration/app-v1-command-data
