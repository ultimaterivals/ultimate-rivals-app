name: Admin Athlete Mirror E2E

on:
  workflow_dispatch:
  push:
    branches:
      - release/season-1-app-final
    paths:
      - .github/workflows/admin-athlete-mirror-e2e-temp.yml
      - tests/e2e/admin-athlete-mirror.spec.ts
      - scripts/qa-local-test-seed.sql
      - src/app/admin/**
      - src/app/athlete/**
      - src/components/**
      - src/lib/**

permissions:
  contents: read

jobs:
  mirror-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      UR_TEST_PASSWORD: "LocalQaPassword123!"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated Supabase
        run: |
          perl -0pi -e 's/(\[db\.seed\][\s\S]*?enabled = )true/${1}false/' supabase/config.toml
          perl -0pi -e 's#sql_paths = \["\./seeds/dev.sql"\]#sql_paths = []#' supabase/config.toml
          perl -0pi -e 's/health_timeout = "2m"/health_timeout = "10m"/' supabase/config.toml
          npx --no-install supabase start
          npx --no-install supabase db reset --local --yes --no-seed
      - name: Export Supabase env
        run: |
          npx --no-install supabase status -o env > supabase.env
          set -a
          . ./supabase.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "DATABASE_URL=${DB_URL}"
            echo "UR_TEST_PASSWORD=${UR_TEST_PASSWORD}"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"
      - name: Seed deterministic QA identities
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/production-reference-data.sql
          psql "$DATABASE_URL" -v test_password="$UR_TEST_PASSWORD" -f scripts/qa-local-test-seed.sql
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright admin mirror desktop + mobile
        run: npx playwright test tests/e2e/admin-athlete-mirror.spec.ts --project=chromium --project=mobile
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-athlete-mirror-playwright-report
          path: playwright-report/
          if-no-files-found: warn
      - name: Stop Supabase
        if: always()
        run: npx --no-install supabase stop --no-backup
