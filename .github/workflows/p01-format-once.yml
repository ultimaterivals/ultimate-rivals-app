name: P01 Format Once

on:
  push:
    branches:
      - feat/athlete-app-p01-shell-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/athlete-app-p01-shell-v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format P01 files
        run: npx prettier --write src/app/athlete/hunter/page.tsx src/components/athlete/athlete-shell.tsx src/components/layout/brand-mark.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/athlete/hunter/page.tsx src/components/athlete/athlete-shell.tsx src/components/layout/brand-mark.tsx
          git commit -m "style: format P01 athlete shell foundation"
          git push origin HEAD:feat/athlete-app-p01-shell-v2
