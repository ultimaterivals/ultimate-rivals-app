name: P08 Format Fix

on:
  push:
    branches:
      - feat/athlete-app-p08-hunter-school

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/athlete-app-p08-hunter-school
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/athlete/hunter/page.tsx tests/e2e/final-uat.spec.ts tests/e2e/visual-uat.spec.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/athlete/hunter/page.tsx tests/e2e/final-uat.spec.ts tests/e2e/visual-uat.spec.ts
          git commit -m "style: format P08 Hunter surfaces"
          git push origin HEAD:feat/athlete-app-p08-hunter-school
