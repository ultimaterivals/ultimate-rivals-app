name: Agenda Preview Format Once

on:
  push:
    branches:
      - integration/app-v1-command-data
    paths:
      - ".github/workflows/agenda-preview-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/app-v1-command-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/athlete/athlete-opportunity-card.tsx src/app/athlete/agenda/page.tsx src/lib/app-command-integration-contract.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/athlete/athlete-opportunity-card.tsx src/app/athlete/agenda/page.tsx src/lib/app-command-integration-contract.test.ts
          git commit -m "style: format Agenda Preview hardening"
          git push
