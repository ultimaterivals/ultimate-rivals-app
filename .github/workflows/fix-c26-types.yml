name: Fix C26 Types

on:
  push:
    branches: [sprint-c26-wave-assisted-execution]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c26-wave-assisted-execution
      - name: Apply deterministic replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/admin/atletas/ondas/executar/page.tsx')
          text = path.read_text()
          replacements = [
              (
                  'import { activateActivationWaveBatchAction } from "@/app/admin/atletas/ondas/actions";',
                  'import { activateWaveBatchExecutionAction } from "@/app/admin/atletas/ondas/executar/actions";',
              ),
              (
                  '<div className="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-5">\n                  {[',
                  '<div className="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-5">\n                  {([',
              ),
              (
                  '["Prontos p/ piloto", pilotReady.length, CheckCircle2],\n                  ].map(([label, value, Icon]) => {\n                    const MetricIcon = Icon as typeof CheckCircle2;',
                  '["Prontos p/ piloto", pilotReady.length, CheckCircle2],\n                  ] as const).map(([label, value, MetricIcon]) => {',
              ),
              (
                  'action={activateActivationWaveBatchAction}',
                  'action={activateWaveBatchExecutionAction}',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, got {count}: {old[:80]}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/admin/atletas/ondas/executar/page.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add src/app/admin/atletas/ondas/executar/page.tsx
          git commit -m "fix: tighten c26 execution typing"
          git push
