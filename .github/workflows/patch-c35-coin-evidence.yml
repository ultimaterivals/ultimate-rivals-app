name: Patch C35 Coin Evidence

on:
  push:
    branches:
      - sprint-c35-ur-coins-evidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-c35-ur-coins-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/app/admin/ur-play/pos-sessao/page.tsx')
          text = page.read_text()
          old_helper = '''function evidenceNumber(evidence: Record<string, unknown>, key: string) {
            const value = Number(evidence[key] ?? 0);
            return Number.isFinite(value) ? value : 0;
          }
          '''
          new_helper = old_helper + '''
          function evidenceText(evidence: Record<string, unknown>, key: string) {
            const value = evidence[key];
            return typeof value === "string" ? value : null;
          }
          '''
          if old_helper not in text:
              raise SystemExit('evidenceNumber helper not found')
          text = text.replace(old_helper, new_helper, 1)

          marker = '''                      {task.notes && (
          '''
          coin_block = '''                      {task.key === "ur_coins" && (
                        <>
                          <div className="mt-4 grid grid-cols-2 gap-2 rounded-ur border p-3 text-center sm:grid-cols-4">
                            <div>
                              <p className="text-[10px] font-bold text-zinc-600 uppercase">Lançamentos</p>
                              <p className="mt-1 font-black">{evidenceNumber(task.evidence, "generated_transactions")}</p>
                            </div>
                            <div>
                              <p className="text-[10px] font-bold text-zinc-600 uppercase">Estornos</p>
                              <p className="mt-1 font-black">{evidenceNumber(task.evidence, "reversal_transactions")}</p>
                            </div>
                            <div>
                              <p className="text-[10px] font-bold text-zinc-600 uppercase">Créditos</p>
                              <p className="mt-1 font-black">{evidenceNumber(task.evidence, "credited_amount")} URC</p>
                            </div>
                            <div>
                              <p className="text-[10px] font-bold text-zinc-600 uppercase">Líquido</p>
                              <p className="mt-1 font-black">{evidenceNumber(task.evidence, "net_amount")} URC</p>
                            </div>
                          </div>
                          {evidenceText(task.evidence, "error") && (
                            <p className="mt-3 rounded-ur border border-red-500/30 bg-red-500/5 p-3 text-xs font-bold text-red-300">
                              {evidenceText(task.evidence, "error")}
                            </p>
                          )}
                        </>
                      )}

          '''
          if marker not in text:
              raise SystemExit('task notes marker not found')
          text = text.replace(marker, coin_block + marker, 1)
          page.write_text(text)

          test = Path('src/server/services/admin-ur-play-post-session-service.test.ts')
          t = test.read_text()
          old = 'managed_by: task_key === "ranking_data" ? "system" : "human",'
          new = 'managed_by: ["ranking_data", "ur_coins"].includes(task_key) ? "system" : "human",'
          if old not in t:
              raise SystemExit('managed_by fixture not found')
          t = t.replace(old, new, 1)
          test.write_text(t)
          PY
      - run: >-
          npx prettier --write
          src/app/admin/ur-play/pos-sessao/page.tsx
          src/server/services/admin-ur-play-post-session-service.test.ts
          src/server/services/admin-ur-play-post-session-service.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/ur-play/pos-sessao/page.tsx \
            src/server/services/admin-ur-play-post-session-service.test.ts \
            src/server/services/admin-ur-play-post-session-service.ts
          git commit -m "feat: expose UR Coins processing evidence" || exit 0
          git push
